<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Śpiewnik">
<title>Śpiewnik</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --card2:#243247;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#facc15; --accent2:#fbbf24;
    --border:#334155; --chord:#fbbf24;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
  }
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---------- Header ---------- */
  header{
    padding:calc(14px + var(--safe-top)) 16px 12px;
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:5;
  }
  header h1{
    margin:0 0 10px; font-size:20px; font-weight:700; letter-spacing:.2px;
    display:flex; align-items:center; gap:8px;
  }
  header h1 .dot{color:var(--accent);}
  .search-wrap{position:relative;}
  #search{
    width:100%; padding:11px 38px 11px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; outline:none;
  }
  #search:focus{border-color:var(--accent);}
  .search-wrap .clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); font-size:20px; padding:6px; cursor:pointer; display:none;
  }
  .count{color:var(--muted); font-size:12px; margin-top:8px;}

  /* ---------- List ---------- */
  #list-view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .letter-header{
    position:sticky; top:0; background:var(--bg); color:var(--accent);
    font-size:12px; font-weight:700; padding:6px 16px; letter-spacing:1px;
    border-bottom:1px solid var(--border);
  }
  ul.songs{list-style:none; margin:0; padding:0 0 calc(24px + var(--safe-bottom));}
  ul.songs li{
    border-bottom:1px solid var(--border);
  }
  ul.songs li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
  }
  ul.songs li button:active{background:var(--card2);}
  ul.songs li button .chev{color:var(--muted); font-size:18px;}
  .empty{padding:40px 20px; text-align:center; color:var(--muted);}

  /* ---------- Detail view ---------- */
  #detail-view{
    position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10;
  }
  #detail-view.open{display:flex;}
  .detail-header{
    padding:calc(12px + var(--safe-top)) 8px 10px 8px;
    background:var(--bg2); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  .back-btn{
    background:none; border:none; color:var(--accent); font-size:16px; padding:8px 10px;
    display:flex; align-items:center; gap:4px; cursor:pointer; border-radius:8px;
  }
  .back-btn:active{background:var(--card2);}
  .detail-title{
    flex:1; font-size:16px; font-weight:700; padding-right:8px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .font-controls{display:flex; gap:4px;}
  .font-controls button{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; cursor:pointer;
  }
  #song-body-wrap{flex:1; overflow:auto; -webkit-overflow-scrolling:touch;}
  pre#song-body{
    margin:0; padding:18px 16px calc(40px + var(--safe-bottom));
    font-family:"SF Mono", "Roboto Mono", Menlo, Consolas, "Courier New", monospace;
    font-size:15px; line-height:1.55; white-space:pre-wrap; word-break:break-word; overflow-x:hidden;
    tab-size:4; -moz-tab-size:4;
  }
  /* chord-looking tokens (heuristic highlight) are wrapped server-side via span.chordline is not used;
     instead we color whole lines that look chord-only using a class added by JS */
  .chord-line{color:var(--chord); font-weight:700;}
  .ref-line{color:#38bdf8;}
</style>
</head>
<body>
<div id="app">

  <div id="list-view">
    <header>
      <h1><span class="dot">♪</span> Śpiewnik</h1>
      <div class="search-wrap">
        <input id="search" type="text" inputmode="search" placeholder="Szukaj tytułu pieśni…" autocomplete="off">
        <button class="clear" id="clearBtn" aria-label="Wyczyść">×</button>
      </div>
      <div class="count" id="count"></div>
    </header>
    <div id="listContainer"></div>
  </div>

  <div id="detail-view">
    <div class="detail-header">
      <button class="back-btn" id="backBtn">‹ Wróć</button>
      <div class="detail-title" id="detailTitle"></div>
      <div class="font-controls">
        <button id="fontMinus">A-</button>
        <button id="fontPlus">A+</button>
      </div>
    </div>
    <div id="song-body-wrap">
      <pre id="song-body"></pre>
    </div>
  </div>

</div>

o pragnęli z serc Cię wyrzucić,\nPokój zakłócić, odebrać nadzieję, wiary znak,\nBo kto Cię, Matko, kochać nie umie, ten nie zrozumie,\nDlaczego przy Tobie trwamy tak.\n\n3. Dziś wróg z ukrycia i bez pancerza.\nW serca uderza, nie pozwól, by zniszczył Boga w nas.\nMatko, błagamy, w czas niespokojny\nBroń nas od wojny, wierzymy - zwyciężysz jeszcze raz."}, {"title": "Matko, która nas znasz", "body": "Ref. Matko, która nas znasz, \t\t\te C\nZ dziećmi Twymi bądź, \t\t\t\tD e\nNa drogach nam nadzieją świeć,\t \te G D\nZ Synem Twym z nami idź.\t\t \te D7 e D e\n\n1. Z wszystkich niewiast wybrana, \t\tG e\nPrzyjdź i drogę wskaż. \t\t\t\te D e\nCórko Ludu Bożego,\t\t\t\tG e\nDo Syna Twego nas prowadź. \t\ta H7\nSłużebnico pokorna,\t\t\t\te C\nPokój światu daj.\t\t\t\t\ta H7 e D\n\n2. Królowo ognisk rodzinnych...\nDziewico, wzorze prostoty...\nOblubienico cieśli...\n\n3. Królowo narodu naszego...\nUciśnionych nadziejo...\nŚwiatło łaknących prawdy...\n\n4. Pociecho ludu biednego...\nPani wszelkiej radości...\nMatko tkliwego serca...\n\n5. Matko przez Syna nam dana...\nMatko, która nas słuchasz...\nTy nas zawsze rozumiesz...\n\n6. Dziewico, Matko Chrystusa...\nDziewico, Matko Kościoła...\nDziewico, Matko ludzi...\n\n7. Dziewico z nami idąca...\nHistorii świata promieniu...\nPośredniczko najlepsza..."}, {"title": "Misericordias Domini", "body": "d    A       d   C\nMisericordias Domini,\n F    C      d A  d\nin aeternum cantabo."}, {"title": "Mów do mnie Panie", "body": "Mów do mnie Panie, chcę słyszeć Cię,\t\th A h fis \nPrzyjąć od Ciebie, co masz dla mnie.\t\th A G\nNie chcę się chować, lecz w Tobie skryć.\t\th A h fis\nW cieniu Twym, Panie, chcę iść.\t\t\th A G A\nŚwięty, potężny jesteś, Panie nasz,\t\t\th G A h\nPrzed Tobą dziś możemy stać,\t\t\tG A h\nDzięki łasce, nie dzięki nam samym.\t\tG h A"}, {"title": "Nasz Bóg jest potężny", "body": " C            G                       D         e                     C\nNasz Bóg jest potężny w mocy swej, króluje nad nami dziś\n               G                        a            h     e\nZ nieba rządzi w mocy, miłości, mądrości swej."}, {"title": "Nasz Bóg jest wielki", "body": "Wodę zamieniłeś w wino\t\t\t\t\t\tcis   A  E\nŚlepi przy Tobie znów widzą, któż jest jak Ty? Tylko Ty?\tcis A E fis H \nBlaskiem rozświetlasz ciemności\t\t\t\t\nCzłowiek powstaje z marności, któż jest jak Ty? Tylko Ty?\t\nRef. Nasz Bóg jest wielki, nasz Bóg jest silny\t\t\tcis A\nBoże nikt inny nie równa się z Tobą.\t\t\t\tE H\nNasz Bóg uzdrawia, jest wszechmogący.\t\t\t\nNasz Bóg, Nasz Bóg.  X2\t\n\nBlaskiem rozświetlasz ciemności\nCzłowiek powstaje z marności, któż jest jak Ty? Tylko Ty?\nRef x2\nJeśli nasz Bóg jest przy nas już nic nas nie zatrzyma!\t\tcis     A\nJeśli nasz Bóg jest z nami, któż jest przeciwko nam?\t\tE  H\nx2\nRef + Ref ac"}, {"title": "Nic nie musisz mówić nic", "body": "Nic nie musisz mówić nic\t\t\te                      C                 \nOdpocznij we mnie\t\t\t\tD                    \nCzuj się bezpiecznie\t\t\t\tG         H7\nPozwól kochać się\t\t\t\te                     C\nMiłość pragnie Ciebie\t\t\t\tD                     G    H7"}, {"title": "Nie mądrość świata tego (Marana tha!)", "body": "d || C                                F || G\nMarana tha, marana tha! /x4\n\n       d                   F\nref.: Nie mądrość świata tego\nC               g                 d\nLecz Pana ukrzyżowanego\n     F       C                 G\nGłosimy aż przyjdzie znów /x2\n\n    d                                      F\n1. Bo Chrystus Jezus skałą serca mego\nC                                  G                           d\nOdsunął kamień, serce z ciała dał mi swego\n                                         F\nBy nas na nowo zrodzić – wstąpił w niebo\nC                               G\nAby świętego Ducha zesłać nam dlatego\n\nref.: Nie mądrość świata tego…\n\n2. Zbawienie swoje z wiarą spożywajcie\t\t\t\t\td     F\nZrodzeni w ogniu z Ducha życiem rozgłaszajcie\t\t\t\tC     G     d\nŻe tego któregośmy krzyżowa instr + ref.2)\tG F C"}, {"title": "Nikt Cię nie kocha tak jak Ja", "body": "Guadalupe \n\n1. Ile czekałem na tą chwilę    \t\t\t\tF C d\nIle czekałem byś zechciał przyjąć Mnie   \t\tB C\nIle czekałem, byś się odezwał \t\t\t\tF C d\nByś w me ramiona w końcu wtulił się \t\t\tB C\n \nJa wiem dobrze, co przeżywasz \t\t\tF C d\nWiem też dobrze, czemu płaczesz \t\t\tB C \nI znam dobrze Twe cierpienie \t\t\t\tF C d\nBo nigdy nie opuściłem Ciebie   \t\t\tB C\n\nRef. Nikt Cię nie kocha tak jak Ja    \t\t\tF C d\nNikt Cię nie kocha tak jak Ja    \t\t\t\tB C\nPopatrz na krzyż oto dowód mej miłości \t\tF C d\nNikt Cię nie kocha tak jak Ja \t\t\t\tB C\n \nNikt Cię nie kocha tak jak Ja \t\t\t\tF C d\nNikt Cię nie kocha tak jak Ja \t\t\t\tB C\nPopatrz na krzyż, to dla Ciebie, bo Cię kocham! \tF C d\nNikt Cię nie kocha tak jak Ja    \t\t\t\tB C F\n \n2. Ja wiem, co chcesz Mi powiedzieć\nChociaż czasem nic nie mówisz\nWiem też dobrze to, co czujesz\nChoć tym ze Mną się nie dzielisz\n \nPrzy Twym boku wciąż kroczyłem\nW trudnych chwilach niosłem Ciebie\nWiedz, że robię to, bo Jestem\nTwym najlepszym przyjacielem!"}, {"title": "Oceany", "body": "h                   \t\t fis              D\nZnad oceanów do mnie wołasz\n                    A                      G     A\nGdzie każdy krok niepewny jest\nh                            \t fis          D\nTy jesteś tam, gdzie niewiadoma\n               A                        G\nTam znajdę grunt dla wiary mej\nG         D                A\nI będę wzywać imię Twe\nG          D                A\nI ponad fale patrzeć chcę\n                  G \nGdy burzą się\n                D                   A\nDla duszy pokój w Tobie jest\n                           G     A\nGdzie pójdziesz Ty\n              h    \t\tfis D   \tA \tG  \t(A)\nJa pójdę też\n\nMój strach utonie w Twojej łasce\t\th                   \t\t fis              D\nBo ręka Twa prowadzi mnie\t\t\tA                      G     A\nI Ty mnie nigdy nie zawiodłeś\t\th                   \t\t f s zawsze masz otwarte serce,\nBo Ty do końca nas umiłowałeś."}, {"title": "Panie, pragnienia ludzkich serc", "body": "         C  e       F                      C           F           e\nRef. Panie, pragnienia ludzkich serc Ty zaspokoisz sam.\n                   a                 e\nPrzyjdź, Chlebie Żywy, Zbawco nasz,\n      d7         G          C\nPszeniczny Darze, przyjdź.\n\n           C         a      F      e      a\n1.Jak pasterz woła owce swe i znają Jego głos,\n          d                  G                  d                 G\nTak wzywasz nas, rodzinę swą, za Tobą chcemy iść.\n\n2.Z radością więc śpiewamy Ci ten dziękczynienia hymn.\nGodnymi czynisz dzisiaj nas niebieski dzielić chleb.\n\n3.Ty, Panie, dajesz siebie nam, by naszym życiem być,\nJak braciom służyć, naucz, jak miłością, prawdą żyć."}, {"title": "Pasja miłości (Beata Bednarz)", "body": "capo1\t\n\n1.Wzgardzony był On  \t\th A h\nPrzygięty cierpieniem\t\th A h\nZraniony i niewinny tak \th A G h\nNiósł ciężar i wstyd\t\th A h\nNiósł grzechy i winy\t\th A h\nChorobę, ból i nasz strach\th A G h\n\nKażdy grzech\t\t\te fis \nNa krzyżu spłacił\t\t\th A\nSwoją krwią\t\t\te fis\n\nRef: On zdradzony jak nikt \tD A\nZraniony jak nikt \t\t \th \nMiał za nas tam iść\t\tA\nZ miłością niosąc krzyż\t\tD\nKto może pojąć dziś\t\tA\nJak wielki był to ból\t\th\nZa ciebie za mnie szedł\t\tA \nJezus mój\t\t\t\tA (h)\n\t2.Za ciebie i mnie\nNa krzyża ramionach\nRozpięty był On Pan i Król\nCzłowiekiem się stał\nI jak człowiek skonał\nZ miłością zniósł strach i ból\n\nKażdy grzech\nNa krzyżu spłacił\nSwoją krwią\n\nRef: Czy wierzysz, że\nOn zdradzony jak nikt\nZraniony jak nikt\nMiał siłę aby iść\nZ miłością niosąc krzyż\nKto może pojąć dziś\nJak wielki był to cud\nBarankiem stał się Bóg\n\nOn zdradzony jak nikt\nZraniony jak nikt\nMiał siłę aby iść\nZ miłością niosąc krzyż\nKto może pojąć dziś\nJak wielki był to cud\nBarankiem stał się Bóg\nJezus mój"}, {"title": "Poddaję wszystko Tobie", "body": "1. Dzisiaj składam epojętą, z Nieba na nas tchniętą miłość,\nNią ogarnij nas, Amen.\t\t\t\t\t\t\tD A\nNią ogarnij nas, Amen.\n\n2.\tObłoku jasny chroń nas przed gniewem złego,\nDaj soli smak i światłu blask.\nNie daj się ukryć miastu Boga przedwiecznego,\nOsłaniaj je, strzeż jego bram.\n\nRef. Przybądź Święty Niepojęty, z Nieba na nas tchnięty Duchu, \nRozpal Świętą, Niepojętą, z Nieba na nas tchniętą miłość,\nNią ogarnij nas, Amen.\t\t\t\t\t\t\t\nNią ogarnij nas, Amen\n\n3.\tPocieszycielu radość Swą ześlij z Nieba,\nWszak Dobry ją obiecał nam.\nPrzerwij milczenie w Imię Syna - Słowa - Chleba,\nNajświętsze tchnienie wołaj w nas.\n\nRef. Przybądź Święty Niepojęty, z Nieba na nas tchnięty Duchu,\nRozpal Świętą, Niepojętą, z Nieba na nas tchniętą miłość,\nNią ogarnij nas, Amen. \nPrzybądź Święty Niepojęty, z Nieba na nas tchnięty Duchu, \nRozpal Świętą, Niepojętą, z Nieba na nas tchniętą miłość,\nNią ogarnij nas, Amen.\t\t\t\t\t\t\t\nNią ogarnij nas, Amen\n\nInstrumental [Ref]\n\t\tRef: Witaj… "}, {"title": "Przychodzisz, Panie", "body": "     F                  g7/F    C                         A7+ A7\nPrzychodzisz, Panie, mimo drzwi zamkniętych,\n d            B7+           g7      A7              B C7\nJezu Zmartwychwstały, ze śladami męki.\n F                g7/F    C                   A7+ A7\nTy jesteś z nami, poślij do nas Ducha!\n d         B7+   g7      A7                 B7 A7 d\nPanie nasz i Boże, uzdrów nasze życie!"}, {"title": "Przyjaciela mam", "body": "Przyjaciela mam, co pociesza mnie,\t\t\tCGaF\nGdy o Jego ramię oprę się.\t\t\nW Nim nadzieję mam, uleciał strach.\nOn najbliżej jest, zawsze troszczy się. \nKrólów Król, z nami Bóg. /2x\t\t Jezus. /4x"}, {"title": "Psalm 126 (niemaGotu)", "body": "fis cis H A E\n1. Gdy Pan odmienił los Syjonu, wydawało się nam, że śnimy!\nfis cis H A E\nUsta nasze były pełne śmiechu, a język śpiewał z radości!\n\nH A\nRef. Mówiono wtedy między narodami:\nE H\n„Wielkie rzeczy im Pan uczynił!”\nfis A\nPan uczynił nam wielkie rzeczy\nE H fis ci           D\njeśli chcesz przez nią wejdź\na                        e\nZbliżmy się do ołtarza,\nG                     D\nBogu oddajmy cześć.\n \n    e         D              G          a                      H7\n1. Dzięki składajmy Mu, bo wielka jest jego łaska\ne           D                  G         a                     H7\nZ grobu powstał dziś Pan, a noc jest pełna blasku\ne        D              G     a                             H7\nChcę dziękować Mu i chcę Go dziś błogosławić\ne         D              G           a                            H7\nJezus, mój Pan i Bóg, On przyszedł aby nas zbawić.\n \n    e              D            G        a                     H7\n2. Lepiej się uciec do Pana, niż zaufać książętom\ne               D       G        a                                    H7\nPan, moja moc i pieśń, podtrzymał gdy mnie popchnięto\ne          D            G       a                             H7\nJuż nie będę się bał – cóż może zrobić mi śmierć?\ne     D              G     a                         H7\nNie, nie lękam się i śpiewam chwały pieśń.\n\n3. Odrzucony Pan stał się kamieniem węgielnym\nPan wysłuchał mnie, On jest zbawieniem mym\nCudem staje się noc, gdy w dzień jest przemieniona\nTańczmy dla niego dziś, prawica Pańska wzniesiona."}]</script>
<script>
(function(){
  const SONGS = JSON.parse(document.getElementById('song-data').textContent);

  const listContainer = document.getElementById('listContainer');
  const searchInput = document.getElementById('search');
  const clearBtn = document.getElementById('clearBtn');
  const countEl = document.getElementById('count');
  const detailView = document.getElementById('detail-view');
  const detailTitle = document.getElementById('detailTitle');
  const songBody = document.getElementById('song-body');
  const backBtn = document.getElementById('backBtn');
  const fontMinus = document.getElementById('fontMinus');
  const fontPlus = document.getElementById('fontPlus');

  function normalize(s){
    return s.toLowerCase()
      .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l')
      .replace(/ń/g,'n').replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z');
  }

  const songsIndexed = SONGS.map((s,i) => ({...s, idx:i, norm: normalize(s.title)}));

  function render(filterText){
    const q = normalize(filterText || '');
    const filtered = q ? songsIndexed.filter(s => s.norm.includes(q)) : songsIndexed;

    countEl.textContent = filtered.length === songsIndexed.length
      ? (songsIndexed.length + ' pieśni')
      : ('Znaleziono: ' + filtered.length);

    if(filtered.length === 0){
      listContainer.innerHTML = '<div class="empty">Brak wyników dla podanej frazy.</div>';
      return;
    }

    let html = '';
    let lastLetter = null;
    let ul = '';
    filtered.forEach(s => {
      const letter = s.title.charAt(0).toUpperCase();
      if(letter !== lastLetter){
        if(ul){ html += '<ul class="songs">' + ul + '</ul>'; ul = ''; }
        html += '<div class="letter-header">' + letter + '</div>';
        lastLetter = letter;
      }
      ul += '<li><button data-idx="' + s.idx + '">' + escapeHtml(s.title) + '<span class="chev">›</span></button></li>';
    });
    if(ul){ html += '<ul class="songs">' + ul + '</ul>'; }
    listContainer.innerHTML = html;
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // Heuristic: a line is a "chord line" if, once split on whitespace, every
  // token looks like a chord symbol (e.g. G, Am, h, fis, D/Fis, C7, A7+, cis)
  const CHORD_TOKEN = /^\(?[A-HZ][a-z#b0-9\+\/\.\|\-]*\)?$/;
  function isChordLine(line){
    const trimmed = line.trim();
    if(!trimmed) return false;
    const tokens = trimmed.split(/\s+/);
    if(tokens.length === 0) return false;
    let chordish = 0;
    tokens.forEach(t => { if(CHORD_TOKEN.test(t)) chordish++; });
    return chordish / tokens.length >= 0.8 && /[A-Ha-h]/.test(trimmed);
  }
  function isRefLine(line){
    return /^\s*(Ref\.?|Refren|REFREN|Bridge|BRIDGE|Coda)\b/i.test(line);
  }

  function openSong(idx){
    const s = SONGS[idx];
    detailTitle.textContent = s.title;
    const lines = s.body.split('\n');
    const frag = document.createDocumentFragment();
    songBody.innerHTML = '';
    lines.forEach((line, i) => {
      const span = document.createElement('span');
      if(isChordLine(line)) span.className = 'chord-line';
      else if(isRefLine(line)) span.className = 'ref-line';
      span.textContent = line;
      frag.appendChild(span);
      if(i < lines.length - 1) frag.appendChild(document.createTextNode('\n'));
    });
    songBody.appendChild(frag);
    detailView.classList.add('open');
    document.getElementById('song-body-wrap').scrollTop = 0;
    history.pushState({song:idx}, '', '#song-' + idx);
  }

  function closeSong(){
    detailView.classList.remove('open');
    if(location.hash.startsWith('#song-')) history.back();
  }

  listContainer.addEventListener('click', e => {
    const btn = e.target.closest('button[data-idx]');
    if(btn) openSong(parseInt(btn.dataset.idx,10));
  });

  backBtn.addEventListener('click', closeSong);
  window.addEventListener('popstate', () => { detailView.classList.remove('open'); });

  searchInput.addEventListener('input', () => {
    clearBtn.style.display = searchInput.value ? 'block' : 'none';
    render(searchInput.value);
  });
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    render('');
    searchInput.focus();
  });

  let fontSize = parseInt(localStorage.getItem('spiewnik_fontsize') || '15', 10);
  function applyFont(){
    songBody.style.fontSize = fontSize + 'px';
    localStorage.setItem('spiewnik_fontsize', String(fontSize));
  }
  fontMinus.addEventListener('click', () => { fontSize = Math.max(11, fontSize-1); applyFont(); });
  fontPlus.addEventListener('click', () => { fontSize = Math.min(26, fontSize+1); applyFont(); });
  applyFont();

  render('');

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
})();
</script>
